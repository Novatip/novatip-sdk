name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # matches the engines field in package.json (>=18)
        node-version: [18, 20]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Assert that all three outputs referenced by the exports map in
      # package.json were actually produced. A silently dropped output
      # (e.g. tsup mis-configuration) is caught here before it ships.
      - name: Assert dist outputs exist
        run: |
          for f in dist/index.js dist/index.cjs dist/index.d.ts; do
            if [ ! -f "$f" ]; then
              echo "ERROR: expected build output '$f' is missing" >&2
              exit 1
            fi
            echo "OK: $f"
          done
